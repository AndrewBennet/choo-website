<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Choo!</title>
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <meta name="theme-color" content="#fffbef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1530" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/og.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="alternate" type="application/atom+xml" title="Choo! blog" href="/blog/feed.xml">
  <script src="/assets/site.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Choo! home"><img src="/assets/icon.svg" alt="" width="36" height="36">Choo!</a>
    <nav class="nav" aria-label="Main">
      <a class="hide-sm" href="/">Home</a>
      <a href="/blog/"{% if page.url == "/blog/" %} aria-current="page"{% endif %}>Blog</a>
      <a href="/support.html">Help</a>
      <a class="btn" href="/#get">Get updates</a>
    </nav>
  </div>
  <div class="progress" aria-hidden="true">
    <svg class="progress-train" viewBox="0 0 46 12"><rect x="0" y="2" width="13" height="8" rx="2" fill="#ff941f"/><rect x="15" y="2" width="13" height="8" rx="2" fill="#ffd642"/><path d="M30 2h10q6 0 6 6v2H30z" fill="#ffd642"/><rect x="38" y="3.5" width="5" height="3" rx="1" fill="#0f1f47"/></svg>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="margin-top:0;border-top:0;padding-top:0">
      <span>© {{ site.time | date: "%Y" }} Andrew Bennet. Choo! is independent, and isn't affiliated with or endorsed by Transport for London, Network Rail, National Rail or any train company.</span>
      <span><a href="/">Home</a> · <a href="/blog/">Blog</a> · <a href="/support.html">Help</a> · <a href="/privacy.html">Privacy</a></span>
    </div>
  </div>
</footer>
</body>
</html>
