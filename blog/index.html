---
layout: base
title: Blog
summary: What’s new in Choo.
---
<div class="page-hero">
  <div class="wrap prose">
    <h1>Blog</h1>
    <p class="lede">{{ page.summary }} <a class="feed-link" href="/blog/feed.xml" aria-label="Blog feed (RSS)" title="Blog feed (RSS)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="5.5" cy="18.5" r="2.5" fill="currentColor"/><path d="M3 10.5a10.5 10.5 0 0 1 10.5 10.5h-3A7.5 7.5 0 0 0 3 13.5z" fill="currentColor"/><path d="M3 3.5a17.5 17.5 0 0 1 17.5 17.5h-3A14.5 14.5 0 0 0 3 6.5z" fill="currentColor"/></svg></a></p>
  </div>
</div>
<div class="wrap prose">
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %B %Y" }}</time>
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      {% if post.summary %}<p>{{ post.summary }}</p>{% endif %}
    </li>
    {% endfor %}
  </ul>
</div>
